[package]
name = "substreams-solana"
version.workspace = true
description.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[features]
default = ["idlgen"]
# The `Idlgen` code generator, used from build scripts only.
idlgen = ["dep:substreams-solana-idlgen"]

[dependencies]
substreams-solana-core = { workspace = true }
substreams-solana-idlgen = { workspace = true, optional = true }
substreams-solana-macro = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
